name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - name: Build
        run: sh build.sh
      - name: Check version matches tag
        run: |
          v=$(grep -oP '#define APP_VERSION L"\K[^"]+' knob.cpp)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "knob.cpp says $v but tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Package
        run: zip "Knob-${GITHUB_REF_NAME#v}.zip" Knob.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Knob.exe "Knob-${GITHUB_REF_NAME#v}.zip" \
            --title "Knob ${GITHUB_REF_NAME#v}" \
            --notes "Download **Knob.exe** and run it. It installs itself to %LOCALAPPDATA%\\Knob and replaces any older version."
