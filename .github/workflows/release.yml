name: Release

on:
  push:
    branches: [main]
    paths: [knob.cpp, app.rc, app.manifest, build.sh, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - name: Build
        run: sh build.sh
      - name: Publish release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP '#define APP_VERSION L"\K[^"]+' knob.cpp)
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already released"; exit 0; fi
          zip "Knob-$v.zip" Knob.exe
          gh release create "v$v" Knob.exe "Knob-$v.zip" --target "$GITHUB_SHA" \
            --title "Knob $v" \
            --notes "Download **Knob.exe** and run it. It installs itself to %LOCALAPPDATA%\\Knob and replaces any older version."
